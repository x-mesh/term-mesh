// term-mesh peer federation protocol, v1.
//
// Wire format: length-prefixed Protobuf.
// See docs/peer-federation-protocol.md for the authoritative spec;
// this file is the canonical schema that both Swift (client/host GUI)
// and Rust (daemon) code consume.
//
// Schema evolution rules:
//   1. Never reuse a field number. Removing a field: mark it reserved.
//   2. New fields must be optional; missing-on-wire must decode to defaults.
//   3. New messages that a peer may lack support for must be gated
//      behind a capability string declared in Hello.capabilities.
//   4. Incompatible changes bump the major in Hello.protocol_version.

syntax = "proto3";

package termmesh.peer.v1;

// ============================================================
// Envelope
// ============================================================

// Every frame on the wire is a length-prefixed Envelope.
// Frames larger than 16 MiB must be rejected with ERR_FRAME_TOO_LARGE.
message Envelope {
  // Monotonic per sender, starts at 1.
  uint64 seq = 1;
  // Echoes a request's seq on replies, 0 otherwise.
  uint64 correlation_id = 2;

  oneof payload {
    Hello hello = 10;
    AuthChallenge auth_challenge = 11;
    Auth auth = 12;
    AuthResult auth_result = 13;

    ListSurfaces list_surfaces = 20;
    SurfaceList surface_list = 21;
    AttachSurface attach_surface = 22;
    AttachResult attach_result = 23;
    DetachSurface detach_surface = 24;
    ListWorkspaces list_workspaces = 25;
    WorkspaceList workspace_list = 26;
    WorkspaceControl workspace_control = 27;
    // Gated behind capability "workspace.lifecycle.v1" (Hello.capabilities).
    CreateWorkspaceRequest create_workspace_request = 28;
    CreateWorkspaceResponse create_workspace_response = 29;

    PtyData pty_data = 30;
    Input input = 31;
    Resize resize = 32;
    GridSnapshot grid_snapshot = 33;
    DataAck data_ack = 34;
    // Gated behind capability "grid.snapshot.v1" (Hello.capabilities) —
    // scrollback is part of the grid model: only a client that renders the
    // typed snapshot has the empty local scrollback these fill.
    ScrollbackRequest scrollback_request = 35;
    ScrollbackChunk scrollback_chunk = 36;

    WorkspaceUpdate workspace_update = 40;

    // Gated behind capability "workspace.lifecycle.v1" (Hello.capabilities).
    RenameWorkspaceRequest rename_workspace_request = 41;
    DeleteWorkspaceRequest delete_workspace_request = 42;
    // Gated behind capability "surface.ensure.v1" (Hello.capabilities).
    EnsureSurfaceRequest ensure_surface_request = 43;
    EnsureSurfaceResponse ensure_surface_response = 44;
    // Gated behind capability "surface.terminate.v1" (Hello.capabilities).
    TerminateSurfaceRequest terminate_surface_request = 45;
    TerminateSurfaceResponse terminate_surface_response = 46;
    // Host-pushed, gated behind capability "host.stats.v1" (Hello.capabilities).
    HostStats host_stats = 47;
    // Gated behind capability "team.roster.v1" (Hello.capabilities).
    ListTeams list_teams = 48;
    TeamList team_list = 49;

    Ping ping = 50;
    Pong pong = 51;

    Goodbye goodbye = 60;

    Error error = 99;
  }
}

// ============================================================
// Handshake
// ============================================================

message Hello {
  // semver, e.g. "1.0.0". Majors must match; minor drift is allowed.
  string protocol_version = 1;
  // Stable 128-bit UUID of this install. Used for per-client authorization.
  bytes peer_id = 2;
  // User-facing name shown in sidebars: "MacBook Pro", "mac-mini.local", etc.
  string display_name = 3;
  // Feature flags a peer advertises: e.g. "grid-snapshot-v1".
  repeated string capabilities = 4;
  // term-mesh marketing version; diagnostics only.
  string app_version = 5;
}

message AuthChallenge {
  // 32 random bytes generated by the host.
  bytes nonce = 1;
  // Method identifiers the host will accept, in order of preference.
  repeated string supported_methods = 2;
}

message Auth {
  // Must be one of AuthChallenge.supported_methods.
  // MVP methods: "ssh-passthrough" (no signature), "token-ed25519".
  string method = 1;
  // Identifier for the key used (empty for ssh-passthrough).
  bytes token_id = 2;
  // Method-specific payload (ed25519(nonce) for token-ed25519).
  bytes signature = 3;
}

message AuthResult {
  bool accepted = 1;
  // Human-readable reason on failure; empty on success.
  string reason = 2;
  // Host-assigned session identifier; echoed for correlation, informational.
  bytes session_id = 3;
}

// ============================================================
// Surface discovery & attach
// ============================================================

message ListSurfaces {}

message SurfaceList {
  repeated SurfaceInfo surfaces = 1;
}

message SurfaceInfo {
  bytes surface_id = 1;
  string workspace_name = 2;
  string title = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  // "terminal" or "browser"; more types may be added later.
  string surface_type = 6;
  // Host policy may forbid per-surface attach.
  bool attachable = 7;
  // Where the surface's shell is NOW: the host reads it from the OS at
  // the moment it answers, so it follows a `cd`. Older hosts reported the
  // spawn directory here and never updated it.
  //
  // A resolved path, which may differ textually from the one the surface
  // was asked to start in — on macOS a spawn in /var/... reports back as
  // /private/var/... . Compare these by resolving both, never as strings.
  string cwd = 8;
  // Git branch of `cwd`, resolved when the host answers, or empty if not
  // a git repo. Follows `cwd` into a different repository.
  string branch = 9;
}

enum AttachMode {
  ATTACH_MODE_UNSPECIFIED = 0;
  ATTACH_MODE_READ_ONLY = 1;
  ATTACH_MODE_CO_WRITE = 2;
  ATTACH_MODE_TAKE_OVER = 3;
}

message AttachSurface {
  bytes surface_id = 1;
  AttachMode mode = 2;
  uint32 client_cols = 3;
  uint32 client_rows = 4;
  // If present, the client is resuming a prior attach; host should replay
  // buffered PtyData starting at this byte_seq, or fall back to GridSnapshot.
  uint64 resume_from_seq = 5;
}

message AttachResult {
  bool accepted = 1;
  string reason = 2;
  bytes surface_id = 3;
  // byte_seq at which the upcoming PtyData stream begins.
  uint64 initial_seq = 4;
  // May differ from the requested mode if the host downgraded (e.g. co-write
  // requested but host granted read-only due to policy).
  AttachMode granted_mode = 5;
}

message DetachSurface {
  bytes surface_id = 1;
}

// ============================================================
// Deterministic surface reconciliation
// ============================================================
//
// EnsureSurface reconciles a caller-chosen logical key to exactly one
// daemon-owned PTY surface. A peer MUST advertise "surface.ensure.v1" before
// either message is sent. Legacy peers safely ignore the new Envelope fields.
// Request ids are one-shot for the authenticated connection across BOTH
// EnsureSurface and TerminateSurface. A dropped response is retried with a
// fresh request_id; the resource operation, not request replay, is idempotent.

enum EnsureSurfaceRestartPolicy {
  ENSURE_SURFACE_RESTART_POLICY_UNSPECIFIED = 0;
  // The logical key is forgotten when its process exits.
  ENSURE_SURFACE_RESTART_POLICY_NEVER = 1;
  // Preserve the logical key/spec and recreate the process after daemon start.
  ENSURE_SURFACE_RESTART_POLICY_ON_DAEMON_RESTART = 2;
}

message EnsureSurfaceRequest {
  // Exactly 16 opaque bytes. A daemon MUST reject reuse of a request_id from
  // either EnsureSurface or TerminateSurface as DUPLICATE_REQUEST_ID. Retrying
  // a dropped request with a fresh request_id is safe and returns REUSED.
  bytes request_id = 1;
  // Caller-scoped logical identity. UTF-8, non-empty, at most 256 bytes.
  string key = 2;
  // Absolute existing directory. UTF-8, non-empty, at most 4096 bytes.
  string cwd = 3;
  // Absolute executable path. UTF-8, non-empty, at most 4096 bytes.
  string executable = 4;
  // Arguments exclude argv[0]. At most 256 entries, each at most 64 KiB.
  repeated string args = 5;
  EnsureSurfaceRestartPolicy restart_policy = 6;
}

enum EnsureSurfaceResult {
  ENSURE_SURFACE_RESULT_UNSPECIFIED = 0;
  ENSURE_SURFACE_RESULT_CREATED = 1;
  ENSURE_SURFACE_RESULT_REUSED = 2;
  ENSURE_SURFACE_RESULT_RECREATED = 3;
  ENSURE_SURFACE_RESULT_SPEC_CONFLICT = 4;
  ENSURE_SURFACE_RESULT_FAILED = 5;
}

enum EnsureSurfaceErrorCode {
  ENSURE_SURFACE_ERROR_CODE_UNSPECIFIED = 0;
  ENSURE_SURFACE_ERROR_CODE_INVALID_REQUEST = 1;
  // The decoded request violates a field limit above. Frames over 16 MiB are
  // rejected earlier by framing as ERR_FRAME_TOO_LARGE.
  ENSURE_SURFACE_ERROR_CODE_REQUEST_TOO_LARGE = 2;
  ENSURE_SURFACE_ERROR_CODE_DUPLICATE_REQUEST_ID = 3;
  ENSURE_SURFACE_ERROR_CODE_CWD_NOT_FOUND = 4;
  ENSURE_SURFACE_ERROR_CODE_CWD_NOT_DIRECTORY = 5;
  ENSURE_SURFACE_ERROR_CODE_CWD_PERMISSION_DENIED = 6;
  ENSURE_SURFACE_ERROR_CODE_COMMAND_NOT_FOUND = 7;
  ENSURE_SURFACE_ERROR_CODE_COMMAND_EXITED = 8;
  ENSURE_SURFACE_ERROR_CODE_SPEC_CONFLICT = 9;
  ENSURE_SURFACE_ERROR_CODE_INTERNAL = 10;
  ENSURE_SURFACE_ERROR_CODE_COMMAND_PERMISSION_DENIED = 11;
  ENSURE_SURFACE_ERROR_CODE_COMMAND_SIGNALED = 12;
  // exec(3) failed with an errno other than not-found or permission-denied.
  ENSURE_SURFACE_ERROR_CODE_COMMAND_EXEC_ERROR = 13;
  // chdir(2) failed with an errno not covered by the specific cwd codes.
  ENSURE_SURFACE_ERROR_CODE_CWD_ERROR = 14;
  ENSURE_SURFACE_ERROR_CODE_EXEC_HANDSHAKE_TRUNCATED = 15;
  ENSURE_SURFACE_ERROR_CODE_EXEC_HANDSHAKE_INVALID_STAGE = 16;
  ENSURE_SURFACE_ERROR_CODE_EXEC_HANDSHAKE_TIMEOUT = 17;
}

message EnsureSurfaceError {
  EnsureSurfaceErrorCode code = 1;
  // Stable machine-readable stage, e.g. "validate", "chdir", or "exec".
  string stage = 2;
  // Redacted diagnostic context. MUST NOT contain args or environment values.
  string safe_context = 3;
  // Child exit status when code is COMMAND_EXITED; zero otherwise.
  int32 exit_code = 4;
  // Terminating signal when code is COMMAND_SIGNALED; zero otherwise.
  int32 signal = 5;
  // Unix errno for CWD_ERROR or COMMAND_EXEC_ERROR; zero otherwise.
  int32 os_error = 6;
}

message EnsureSurfaceResponse {
  // Echoes EnsureSurfaceRequest.request_id exactly.
  bytes request_id = 1;
  EnsureSurfaceResult result = 2;
  // Stable for a logical key, including across daemon recreation.
  bytes surface_id = 3;
  // Unique to one live PTY process instance.
  bytes instance_id = 4;
  // Monotonically increases whenever a key is recreated.
  uint64 generation = 5;
  // Host process id for diagnostics; zero when no process is running.
  uint32 pid = 6;
  // Canonical hash of cwd/executable/args/restart_policy. Never raw secrets.
  bytes spec_hash = 7;
  // Present for SPEC_CONFLICT and FAILED; absent on success.
  EnsureSurfaceError error = 8;
}

// TerminateSurface removes exactly one ensured surface from the live PTY
// registry, durable ensured-state, and workspace layout. It never selects a
// surface by name or by current attachment.
message TerminateSurfaceRequest {
  // Exactly 16 opaque bytes; one-shot across EnsureSurface and
  // TerminateSurface for the authenticated connection. If a response is
  // dropped, retry with a fresh request_id. Reusing this id is always
  // DUPLICATE_REQUEST_ID and is never a response-replay mechanism.
  bytes request_id = 1;
  // Exact 16-byte SurfaceInfo.surface_id returned by EnsureSurfaceResponse.
  bytes surface_id = 2;
}

enum TerminateSurfaceResult {
  TERMINATE_SURFACE_RESULT_UNSPECIFIED = 0;
  TERMINATE_SURFACE_RESULT_TERMINATED = 1;
  // Idempotent success: the exact surface does not exist or is not ensured.
  // A fresh-id retry after a successful terminate whose response was dropped
  // therefore returns NOT_FOUND.
  TERMINATE_SURFACE_RESULT_NOT_FOUND = 2;
  TERMINATE_SURFACE_RESULT_FAILED = 3;
}

enum TerminateSurfaceErrorCode {
  TERMINATE_SURFACE_ERROR_CODE_UNSPECIFIED = 0;
  TERMINATE_SURFACE_ERROR_CODE_INVALID_REQUEST = 1;
  TERMINATE_SURFACE_ERROR_CODE_DUPLICATE_REQUEST_ID = 2;
  TERMINATE_SURFACE_ERROR_CODE_INTERNAL = 3;
}

message TerminateSurfaceError {
  TerminateSurfaceErrorCode code = 1;
  // Stable machine-readable stage: "validate", "terminate", or "internal".
  string stage = 2;
  // Redacted diagnostic context; never command, args, env, or secrets.
  string safe_context = 3;
}

message TerminateSurfaceResponse {
  // Echoes TerminateSurfaceRequest.request_id exactly.
  bytes request_id = 1;
  TerminateSurfaceResult result = 2;
  // Echoes the exact requested surface_id on every result.
  bytes surface_id = 3;
  // Present only for FAILED; absent for TERMINATED and NOT_FOUND.
  TerminateSurfaceError error = 4;
}

// ============================================================
// Workspace listing (layout-preserving attach)
// ============================================================
//
// A workspace is a host-side tab containing a recursive split tree
// of panes. Clients use ListWorkspaces to discover the host's tab
// inventory plus enough split-layout information to reconstruct the
// arrangement locally (e.g. with NSSplitView). Each pane references
// a SurfaceInfo.surface_id; clients then call AttachSurface for
// every pane they want to render.

message ListWorkspaces {}

message WorkspaceList {
  repeated Workspace workspaces = 1;
}

message Workspace {
  bytes workspace_id = 1;
  string title = 2;
  // Root of the recursive split tree.
  WorkspaceLayout layout = 3;
  // Identifier of the host *window* that owns this workspace. A host may
  // have several top-level windows open, each with its own set of
  // workspaces (tabs); clients group the workspace roster by this id so
  // tabs from different windows are visually separated. Field-additive
  // and backward compatible: hosts that predate multi-window enumeration
  // leave it empty, and clients treat an empty window_id as a single
  // implied window (legacy flat-list behavior).
  bytes window_id = 4;
  // Human-readable label for window_id (e.g. the window's title bar text),
  // used for the section header in the client's workspace picker/sidebar.
  // May be empty; clients fall back to a short window_id hex suffix.
  string window_title = 5;
  // True for the daemon's current default workspace (owns the static
  // TERMMESH_PEER_SURFACES shells; un-namespaced control commands land
  // here). The default is deletable — the host only refuses removing the
  // LAST workspace (LastWorkspace), promoting a survivor if the deleted
  // one was default. Clients surface this so the delete confirmation can
  // warn "the default is being replaced". Legacy hosts leave it false.
  bool is_default = 6;
}

// Recursive node: either a split (interior) or a pane (leaf).
message WorkspaceLayout {
  oneof node {
    WorkspaceSplit split = 1;
    WorkspacePane pane = 2;
  }
}

message WorkspaceSplit {
  // "horizontal" (side-by-side) or "vertical" (stacked).
  // Mirrors bonsplit's orientation strings on the host.
  string orientation = 1;
  // Fraction in [0.0, 1.0] of the parent's first child.
  double divider_position = 2;
  WorkspaceLayout first = 3;
  WorkspaceLayout second = 4;
  // Stable identifier of the bonsplit split node, so clients can ask
  // the host to update the divider via SetDividerPositionRequest. May
  // be empty for hosts that don't expose stable split ids.
  bytes split_id = 5;
}

message WorkspacePane {
  // surface_id of the currently *active* tab in this bonsplit pane.
  // Always equals one of `tabs[i].surface_id` — the active tab is
  // intentionally also included in `tabs[]` so clients can render
  // the strip from a single source. Compare against `surface_id`
  // here to highlight which strip entry is selected.
  bytes surface_id = 1;
  string title = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  string cwd = 5;
  // Every tab the host has stacked in this bonsplit pane (Phase E-4),
  // active one included. Clients render the strip from this list and
  // ask the host to switch the active tab via
  // WorkspaceControl.activate_tab.
  repeated PaneTab tabs = 6;
  // Activity indicator: true when the pane's ACTIVE surface has a
  // foreground process group distinct from its shell — i.e. a command is
  // running — and false when the shell sits at its prompt (idle). Derived
  // host-side from tcgetpgrp(pty_master) != shell_pgid at serialization
  // time (ListWorkspaces + every WorkspaceLayoutChanged push), so it costs
  // one syscall per pane on an event that already fires — no polling.
  // Field-additive and backward compatible: hosts that predate this leave
  // it false, which clients render as idle.
  bool busy = 7;
  // Absolute path of the project this pane works inside — the nearest
  // ancestor of `cwd` holding a `.git` entry — or empty when the pane is
  // not inside a repository. Clients group workspaces by project, and `cwd`
  // alone cannot answer that: `/srv/app/backend` is indistinguishable from
  // a project root without asking the filesystem, which only the host can
  // do. Field-additive: hosts that predate this leave it empty and clients
  // fall back to guessing from `cwd`.
  string project_root = 8;
}

message PaneTab {
  bytes surface_id = 1;
  string title = 2;
}

// ============================================================
// Workspace lifecycle (create/rename/delete)
// ============================================================
//
// Gated behind capability "workspace.lifecycle.v1" (Hello.capabilities,
// evolution rule 3). A host that doesn't advertise this capability may
// not implement these Envelope payloads yet: senders must check the
// peer's advertised capabilities before use, and hosts that receive one
// of these payloads without support are expected to fall through the
// unhandled-payload path (connection stays alive, no reply is sent —
// see docs/peer-federation-protocol.md and the F8 regression test),
// never crash or drop the connection.
//
// RenameWorkspaceRequest and DeleteWorkspaceRequest reference an
// existing workspace_id (as surfaced by WorkspaceList/Workspace.workspace_id
// or a prior CreateWorkspaceResponse). Hosts MUST safely reject an empty
// or unknown workspace_id — respond with Error (or a false `accepted`
// on the paired response, where one exists) rather than treating it as
// "the current workspace" or "all workspaces".

message CreateWorkspaceRequest {
  // Human-readable title for the new, initially pane-less workspace.
  // May be empty; the host may substitute a default title.
  string title = 1;
}

message CreateWorkspaceResponse {
  bool accepted = 1;
  // Human-readable reason on failure; empty on success.
  string reason = 2;
  // Host-assigned id of the newly created workspace. Empty when
  // accepted == false.
  bytes workspace_id = 3;
}

message RenameWorkspaceRequest {
  // Must reference an existing workspace_id. Empty or unknown ids must
  // be safely rejected by the host, never silently applied to an
  // unrelated (e.g. "current") workspace.
  bytes workspace_id = 1;
  string title = 2;
}

message DeleteWorkspaceRequest {
  // Must reference an existing workspace_id. Empty or unknown ids must
  // be safely rejected by the host (no-op + error reply), never
  // interpreted as "delete all" or "delete current".
  bytes workspace_id = 1;
}

// Pushed by the host to every attached client when a workspace is
// deleted (via DeleteWorkspaceRequest or a host-local UI action), so
// clients can drop it from their sidebar/roster without polling
// ListWorkspaces.
message WorkspaceRemoved {
  bytes workspace_id = 1;
}

// ============================================================
// Workspace control (client → host)
// ============================================================
//
// Fire-and-forget commands that ask the host to mutate the workspace
// layout. The host applies the change via its bonsplit controller and
// publishes the resulting layout via the existing
// `WorkspaceLayoutChanged` push, so the client doesn't need a paired
// reply — it just observes the layout update arriving moments later.

message WorkspaceControl {
  oneof kind {
    SplitPaneRequest split_pane = 1;
    ClosePaneRequest close_pane = 2;
    FocusPaneRequest focus_pane = 3;
    SetDividerPositionRequest set_divider = 4;
    NewTabRequest new_tab = 5;
    ActivateTabRequest activate_tab = 6;
  }
}

message SplitPaneRequest {
  // surfaceID of the pane to split (the focused leaf in the relay
  // window). The host resolves it back to its bonsplit pane.
  bytes pane_id = 1;
  // "horizontal" (side-by-side) or "vertical" (stacked).
  string orientation = 2;
}

message ClosePaneRequest {
  bytes pane_id = 1;
}

message FocusPaneRequest {
  bytes pane_id = 1;
}

message SetDividerPositionRequest {
  bytes split_id = 1;
  // Fraction in [0.0, 1.0] of the first child.
  double ratio = 2;
  // Owning workspace. split_id is unique only WITHIN a workspace's tree
  // (each LayoutStore has its own counter), so two workspaces routinely
  // share a split_id — without this, the host would resize whichever
  // tree matches first. Empty = legacy client; the host falls back to
  // first-match (single-workspace behavior).
  bytes workspace_id = 3;
}

message NewTabRequest {
  // surfaceID of any pane that lives in the bonsplit pane where the
  // new terminal tab should appear. The host resolves it back to the
  // pane id and creates a new tab there.
  bytes pane_id = 1;
  // Target workspace for the "empty workspace" case, where pane_id is
  // empty/unresolvable because the workspace has no panes yet (e.g.
  // right after CreateWorkspaceRequest). Ignored when pane_id resolves
  // to an existing pane. Gated behind capability "workspace.lifecycle.v1".
  bytes workspace_id = 2;
}

message ActivateTabRequest {
  // surfaceID of any pane that lives in the bonsplit pane whose tab
  // strip we're operating on (typically the currently-active pane).
  bytes pane_id = 1;
  // surfaceID of the tab to make active.
  bytes surface_id = 2;
}

// ============================================================
// Terminal data plane
// ============================================================

message PtyData {
  bytes surface_id = 1;
  // Cumulative byte offset since this attach session began.
  uint64 byte_seq = 2;
  bytes payload = 3;
}

message Input {
  bytes surface_id = 1;
  oneof kind {
    // Raw key bytes already encoded in the terminal's expected form.
    bytes keys = 10;
    MouseEvent mouse = 11;
    Paste paste = 12;
  }
}

message MouseEvent {
  uint32 col = 1;
  uint32 row = 2;
  // 0=move, 1=left, 2=middle, 3=right, 4=wheel-up, 5=wheel-down.
  uint32 button = 3;
  // Bitfield: 1=shift, 2=ctrl, 4=alt, 8=cmd.
  uint32 modifiers = 4;
  bool pressed = 5;
}

message Paste {
  bytes text = 1;
}

message Resize {
  bytes surface_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  uint32 pixel_width = 4;
  uint32 pixel_height = 5;
}

// Visible-screen keyframe for a fresh attach (capability
// "grid.snapshot.v1"). Scrollback is NOT included here; clients
// reconnecting within the host ring buffer get bytes replayed via
// `resume_from_seq`, clients outside accept scrollback loss.
//
// The screen travels as an ANSI re-render (`ansi`), not as cells. The
// protocol doc's open question ("cells vs ANSI re-render — decide when
// prototyping") was settled for ANSI at implementation time: both
// encodings would be produced by the same host-side emulator, so cells
// add no robustness — but they DO add drift surface (an attrs bitfield
// whose layout was never specified, host-resolved palette RGB where the
// viewer's theme should decide) and cost 10-20x the bytes of the
// equivalent escape stream. The cell fields were designed and codegen'd
// but never emitted by any released host, so their numbers are reserved
// rather than carried forward; a cell encoding, if ever wanted, claims a
// "grid-snapshot-v2" capability per the evolution rules.
message GridSnapshot {
  bytes surface_id = 1;
  // Host-absolute byte_seq this snapshot is consistent with. Equals
  // AttachResult.initial_seq for this attach. Snapshot bytes are synthetic
  // and spend no wire byte_seq: the first live PtyData after this message
  // starts at wire byte_seq 0, so the client resets its wire-gap baseline
  // to zero and keeps translating wire positions via initial_seq.
  uint64 byte_seq = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  bool alt_screen = 5;
  CursorState cursor = 6;
  // Former `repeated GridRow rows_data`.
  reserved 7;
  reserved "rows_data";
  // The rendered screen: feed to a terminal as-is. Self-contained — leads
  // with clear+home, ends with cursor position, includes input-mode state,
  // and is prefixed with the alt-screen switch when `alt_screen` is true.
  bytes ansi = 8;
}

// Ask the host to render a window of its scrollback (tmux copy-mode
// model: scrollback lives on the host and is fetched on demand when the
// viewer scrolls to the top of what it has). `offset_rows` counts up from
// the live screen's bottom — offset 0 is the live screen itself, so a
// first request typically asks for offset = viewport height.
message ScrollbackRequest {
  bytes surface_id = 1;
  // How many rows above the live view's bottom the requested window's
  // bottom sits. Clamped by the host to what its scrollback actually holds.
  uint32 offset_rows = 2;
}

// One rendered scrollback window. `ansi` is a full-screen replacement
// render (clear+home first, viewport-sized) at the effective offset — the
// client swaps its screen wholesale while browsing, exactly like tmux
// copy-mode, and returns to the live screen (offset 0 / a fresh
// GridSnapshot) when done.
message ScrollbackChunk {
  bytes surface_id = 1;
  // The offset actually rendered, after clamping. Echoing it back lets the
  // client detect "I asked for further up than exists".
  uint32 offset_rows = 2;
  bytes ansi = 3;
  // True when the rendered window is at (or clamped to) the oldest
  // scrollback the host still holds — the client should stop asking for
  // more on further upward scrolls.
  bool at_top = 4;
  // Rows of scrollback the host currently holds for this surface, for UI
  // hints. 0 both when empty and when the host has scrollback disabled.
  uint32 total_scrollback_rows = 5;
}

message CursorState {
  uint32 col = 1;
  uint32 row = 2;
  bool visible = 3;
  // libghostty cursor style enum; mirrors GhosttyKit's value.
  uint32 style = 4;
}

// Advisory: clients may send periodically for RTT measurement and so the
// host can trim its reconnect ring buffer. Not required for correctness.
message DataAck {
  bytes surface_id = 1;
  uint64 ack_seq = 2;
}

// ============================================================
// Workspace structural events
// ============================================================

message WorkspaceUpdate {
  oneof kind {
    SurfaceAdded added = 1;
    SurfaceRemoved removed = 2;
    SurfaceRetitled retitled = 3;
    WorkspaceMeta meta = 4;
    SplitChanged split = 5;
    // Pushed by the host whenever a workspace's split tree changes
    // (divider drag, new split, pane close, ...). Carries the full
    // refreshed `WorkspaceLayout` so attached clients can diff
    // against their current state and patch the layout in place.
    WorkspaceLayoutChanged workspace_layout = 6;
    // Pushed when a workspace itself (not a pane inside one) is
    // deleted. Gated behind capability "workspace.lifecycle.v1".
    WorkspaceRemoved workspace_removed = 7;
  }
}

message SurfaceAdded {
  SurfaceInfo surface = 1;
  bytes pane_id = 2;
}

message SurfaceRemoved {
  bytes surface_id = 1;
}

message SurfaceRetitled {
  bytes surface_id = 1;
  string title = 2;
}

message WorkspaceMeta {
  string branch = 1;
  string cwd = 2;
  repeated uint32 ports = 3;
  string latest_notification = 4;
}

message SplitChanged {
  bytes pane_id = 1;
  // Opaque tree snapshot; sidebar decoder will be versioned separately.
  // Placeholder until the split-tree schema is frozen.
  bytes snapshot = 2;
}

message WorkspaceLayoutChanged {
  bytes workspace_id = 1;
  WorkspaceLayout layout = 2;
}

// ============================================================
// Host system stats
// ============================================================

// How loaded the machine hosting these panes currently is.
//
// Pushed by the host on its own schedule (whatever cadence its monitor
// already samples at) rather than polled, so a viewer that wants to show
// this continuously does not have to ask repeatedly. Sent only to clients
// that advertised "host.stats.v1", so an older viewer receives nothing.
//
// Deliberately about the HOST, not a workspace: the numbers are the same
// for every workspace on that machine, and attaching them to
// `WorkspaceUpdate` would send N copies of one fact.
//
// Every field is a point-in-time sample and may be absent (zero) on a
// host that cannot measure it — a viewer must render what it has rather
// than wait for a complete set.
message HostStats {
  // Load averages over the last 1, 5 and 15 minutes. None are normalized
  // by core count; pair with `cpu_count` to judge whether they are high.
  //
  // All three are worth carrying: one figure says how busy the machine is,
  // but the three together say whether it is climbing, settled, or on its
  // way back down — which is what tells you to wait or to go look.
  double load_1m = 1;
  uint32 cpu_count = 2;
  // Percentage of physical memory in use, 0-100.
  float memory_percent = 3;
  uint64 memory_used_bytes = 4;
  uint64 memory_total_bytes = 5;
  // Aggregate across all disks / all network interfaces. Rates, not
  // totals: bytes moved during the host's last sampling interval.
  uint64 disk_read_bytes_per_sec = 6;
  uint64 disk_write_bytes_per_sec = 7;
  uint64 net_rx_bytes_per_sec = 8;
  uint64 net_tx_bytes_per_sec = 9;
  double load_5m = 10;
  double load_15m = 11;
}

// ============================================================
// Team roster (capability "team.roster.v1")
// ============================================================
//
// A project can span machines, and the first question anyone asks about
// such a project is where its leader sits. Panes and workspaces alone
// cannot answer it: a leader is a team-level fact, invisible in the
// layout tree. This is a READ of that fact — no command crosses here.

message ListTeams {}

message TeamList {
  repeated Team teams = 1;
}

message Team {
  string name = 1;
  // Stable across a leader restart; the on-disk metadata key.
  string team_uuid = 2;
  // Where the team was created — the directory its leader drives.
  string working_directory = 3;
  // Repository root containing `working_directory`, empty when it is not
  // inside one. Clients group by project, and only the host can resolve
  // this (same reasoning as WorkspacePane.project_root).
  string project_root = 4;
  repeated string agent_names = 5;
  uint64 created_at_unix_secs = 6;
}

// ============================================================
// Keepalive & shutdown
// ============================================================

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

message Goodbye {
  string reason = 1;
}

// ============================================================
// Error
// ============================================================

message Error {
  // See docs/peer-federation-protocol.md §Error Codes for the taxonomy.
  // Codes < 500 are surface-fatal; >= 500 are connection-fatal.
  uint32 code = 1;
  string message = 2;
  // Raw 16 bytes if the error pertains to a specific prior message.
  bytes correlation_id_bytes = 3;
}
