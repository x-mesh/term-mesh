			shellScript = "# Generate BuildInfo.swift with git SHA\n\"${SRCROOT}/scripts/generate-build-info.sh\"\nset -euo pipefail\nDEST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nGHOSTTY_DEST=\"${DEST}/ghostty\"\nTERMINFO_DEST=\"${DEST}/terminfo\"\nTERMMESH_SHELL_DEST=\"${DEST}/shell-integration\"\nSRC_SHARE=\"${SRCROOT}/ghostty/zig-out/share\"\nGHOSTTY_SRC=\"${SRC_SHARE}/ghostty\"\nTERMINFO_SRC=\"${SRC_SHARE}/terminfo\"\nFALLBACK_GHOSTTY=\"${SRCROOT}/Resources/ghostty\"\nFALLBACK_TERMINFO=\"${SRCROOT}/Resources/ghostty/terminfo\"\nTERMINFO_OVERLAY=\"${SRCROOT}/Resources/terminfo-overlay\"\nTERMMESH_SHELL_SRC=\"${SRCROOT}/Resources/shell-integration\"\nif [ -d \"$GHOSTTY_SRC\" ]; then\n  mkdir -p \"$GHOSTTY_DEST\"\n  rsync -a --delete \"$GHOSTTY_SRC/\" \"$GHOSTTY_DEST/\"\nelif [ -d \"$FALLBACK_GHOSTTY\" ]; then\n  mkdir -p \"$GHOSTTY_DEST\"\n  rsync -a --delete \"$FALLBACK_GHOSTTY/\" \"$GHOSTTY_DEST/\"\nfi\nif [ -d \"$TERMINFO_SRC\" ]; then\n  mkdir -p \"$TERMINFO_DEST\"\n  rsync -a --delete \"$TERMINFO_SRC/\" \"$TERMINFO_DEST/\"\nelif [ -d \"$FALLBACK_TERMINFO\" ]; then\n  mkdir -p \"$TERMINFO_DEST\"\n  rsync -a --delete \"$FALLBACK_TERMINFO/\" \"$TERMINFO_DEST/\"\nfi\n# Overlay any term-mesh-specific terminfo adjustments.\n# This intentionally does not use --delete so we only patch specific entries.\nif [ -d \"$TERMINFO_OVERLAY\" ]; then\n  mkdir -p \"$TERMINFO_DEST\"\n  rsync -a \"$TERMINFO_OVERLAY/\" \"$TERMINFO_DEST/\"\nfi\nif [ -d \"$TERMMESH_SHELL_SRC\" ]; then\n  mkdir -p \"$TERMMESH_SHELL_DEST\"\n  # Use '/.' so dotfiles like .zshenv/.zprofile are copied too.\n  rsync -a \"$TERMMESH_SHELL_SRC/.\" \"$TERMMESH_SHELL_DEST/\"\nfi\n# Copy term-mesh Ghostty config overrides (e.g. shell-integration=none).\nTERMMESH_CONF=\"${SRCROOT}/Resources/ghostty-termmesh.conf\"\nif [ -f \"$TERMMESH_CONF\" ]; then\n  cp -p \"$TERMMESH_CONF\" \"$DEST/ghostty-termmesh.conf\"\nfi\nTEAM_TEMPLATES_BUILTIN=\"${SRCROOT}/Resources/team-templates.builtin.json\"\nif [ -f \"$TEAM_TEMPLATES_BUILTIN\" ]; then\n  cp -p \"$TEAM_TEMPLATES_BUILTIN\" \"$DEST/team-templates.builtin.json\"\nfi\n# Copy team scripts into the bundle for Release builds.\nTEAM_SCRIPTS_SRC=\"${SRCROOT}/scripts\"\nTEAM_SCRIPTS_DEST=\"${DEST}/scripts\"\nif [ -d \"$TEAM_SCRIPTS_SRC\" ]; then\n  mkdir -p \"$TEAM_SCRIPTS_DEST\"\n  for f in team-leader.sh team-leader-claude.sh tm-agent.sh agent-notify.sh agent-title.sh leader-turn-hook.sh; do\n    [ -f \"$TEAM_SCRIPTS_SRC/$f\" ] && cp -p \"$TEAM_SCRIPTS_SRC/$f\" \"$TEAM_SCRIPTS_DEST/$f\"\n  done\n  chmod +x \"$TEAM_SCRIPTS_DEST\"/*.sh 2>/dev/null || true\nfi\n# Agent bridge + renderer. Without these in the bundle a Release app run from\n# any directory but this repo finds no bridge, so codex/kiro silently fall back\n# to a terminal and cursor/agy have no fallback at all.\nSPIKE_SRC=\"${TEAM_SCRIPTS_SRC}/spike\"\nSPIKE_DEST=\"${TEAM_SCRIPTS_DEST}/spike\"\nif [ -d \"$SPIKE_SRC\" ]; then\n  mkdir -p \"$SPIKE_DEST\"\n  for f in tm-agent-bridge.py tm-render-claude.py; do\n    [ -f \"$SPIKE_SRC/$f\" ] && cp -p \"$SPIKE_SRC/$f\" \"$SPIKE_DEST/$f\"\n  done\n  chmod +x \"$SPIKE_DEST\"/*.py 2>/dev/null || true\nfi\n# Copy Claude slash commands + skills into the bundle (single source of truth).\n# Command/skill list lives in scripts/copy-claude-commands.sh.\n\"${SRCROOT}/scripts/copy-claude-commands.sh\"\nINFO_PLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\nCOMMIT=\"$(git -C \"${SRCROOT}\" rev-parse --short=9 HEAD 2>/dev/null || true)\"\nif [ -n \"$COMMIT\" ] && [ -f \"$INFO_PLIST\" ]; then\n  /usr/libexec/PlistBuddy -c \"Set :TermMeshCommit $COMMIT\" \"$INFO_PLIST\" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c \"Add :TermMeshCommit string $COMMIT\" \"$INFO_PLIST\" >/dev/null 2>&1 || true\nfi\n";
		};
