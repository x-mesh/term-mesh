name: release-linux

# Builds term-meshd for Linux (x86_64 + aarch64) whenever a version tag is
# pushed, and attaches the binaries to that tag's GitHub Release alongside
# the macOS DMG (published separately by scripts/publish-github-release.sh
# via /release). Runs on native runners for both architectures — no cross
# compilation, no Docker — so build behavior matches a real Linux host
# exactly (see docs/peer-linux-host.md's own build notes).
#
# term-meshd/src/http.rs embeds two repo-root paths at compile time
# (Resources/dashboard/index.html, Assets.xcassets/AppIcon.appiconset/128.png).
# A full checkout (not a sparse one scoped to daemon/) keeps both present;
# omitting either breaks the build with a confusing include_str!/include_bytes!
# error, not a missing-file-at-runtime one. See docs/peer-linux-host.md
# "Build" section for the same pitfall found the hard way against a real
# Linux box before this workflow existed.
#
# Only term-meshd ships here — it's the peer host binary install.sh
# installs. tm-agent (the peer client / team-ops CLI) is a macOS-side tool
# and isn't part of this release surface.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload assets for"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # term-meshd links glibc dynamically (no musl). glibc is only
          # backward compatible, so a binary built against a runner's own
          # glibc (22.04 → 2.35, 24.04 → 2.39) refuses to load on any older
          # host ("GLIBC_2.xx not found" — hit for real on okrd-mesh-jinwoo,
          # and on a CentOS 7 / glibc 2.17 peer). We build natively per arch
          # but link through cargo-zigbuild against a glibc 2.17 floor, so
          # the same binary runs on anything from RHEL/CentOS 7 upward
          # without changing runtime semantics (still glibc, not musl).
          # The runner OS no longer sets the floor — the `.2.17` target
          # suffix does; the "verify glibc floor" step enforces it.
          - arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # zig is the cross-glibc linker cargo-zigbuild drives; pinned so the
      # link toolchain is reproducible across runs.
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon -> target

      - name: build term-meshd (release, glibc 2.17 floor)
        working-directory: daemon
        # The `.2.17` suffix tells zig to link against glibc 2.17 symbol
        # versions. rust still emits code for the host triple (no `.2.17`
        # in the target dir), so output lands under the base triple below.
        run: cargo zigbuild --release -p term-meshd --target ${{ matrix.rust_target }}.2.17

      - name: verify glibc floor
        working-directory: daemon
        # Guards the whole point of the zigbuild step: assert no glibc
        # symbol above 2.17 slipped into the binary. A regression here would
        # ship an asset that fails to load on the very hosts this targets,
        # and it would only surface on a user's box — so fail the release now.
        run: |
          set -euo pipefail
          bin="target/${{ matrix.rust_target }}/release/term-meshd"
          command -v objdump >/dev/null || { echo "ERROR: objdump is required for the GLIBC gate" >&2; exit 1; }
          objdump_output=$(objdump -T "$bin")
          # awk deliberately succeeds when there are no GLIBC imports (for
          # example, a future static binary). With pipefail still enabled, an
          # objdump/sort/tail failure cannot be mistaken for "no symbols".
          maxsym=$(printf '%s\n' "$objdump_output" \
            | awk '{ line = $0; while (match(line, /GLIBC_[0-9]+(\.[0-9]+)*/)) { print substr(line, RSTART, RLENGTH); line = substr(line, RSTART + RLENGTH) } }' \
            | sort -V \
            | tail -n1)
          echo "max glibc symbol required: ${maxsym:-none}"
          if [ -n "$maxsym" ]; then
            ver=${maxsym#GLIBC_}
            if [ "$(printf '%s\n2.17\n' "$ver" | sort -V | tail -n1)" != "2.17" ]; then
              echo "ERROR: binary requires ${maxsym}, above the 2.17 floor" >&2
              exit 1
            fi
          fi

      - name: package
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          ASSET="term-meshd-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "$ASSET" -C "daemon/target/${{ matrix.rust_target }}/release" term-meshd
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          # The macOS DMG (uploaded separately, locally, via /release) may
          # land before or after this job — softprops/action-gh-release
          # creates the release if missing and otherwise only appends/
          # replaces the files listed above, so the two never race on
          # each other's assets.
          fail_on_unmatched_files: true
