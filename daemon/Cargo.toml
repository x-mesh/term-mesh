[workspace]
resolver = "2"
members = [
    "term-meshd",
    "term-mesh-cli",
    "peer-proto",
    "term-mesh-peer-relay",
    "sync-protocol",
    "tm-coordinator",
    "tm-agent-bridge",
]

# Force static linking of zlib so term-meshd doesn't depend on Homebrew's libz.
# Without this, libgit2-sys links dynamically to /opt/homebrew/opt/zlib/lib/libz.1.dylib
# which crashes on machines without Homebrew (e.g. DMG installs on user machines).
[workspace.dependencies]
libz-sys = { version = "1", features = ["static"] }

[patch.crates-io]
vt100 = { path = "../vendor/vt100" }

# At opt-level 0 clap's derived Commands::augment_subcommands gets a ~1.6 MiB frame (no stack-slot sharing), overflowing the 2 MiB test thread stack.
[profile.dev.package.term-mesh-cli]
opt-level = 1
