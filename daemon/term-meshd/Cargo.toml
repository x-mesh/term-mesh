[package]
name = "term-meshd"
version = "0.193.0"
edition = "2021"
rust-version = "1.88"
description = "term-mesh background daemon — worktree orchestration, resource monitoring, file heatmap"

[[bin]]
name = "term-meshd"
path = "src/main.rs"

[[bench]]
name = "mesh_sync_scale"
harness = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Git worktree orchestration (F-01)
git2 = { version = "0.19", features = ["vendored-openssl", "vendored-libgit2"] }
flate2 = "1"
sha1 = "0.10"
memmap2 = "0.9"

# Serialization (JSON-RPC over Unix Socket)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Resource monitoring (F-03/F-04)
sysinfo = "0.33"
libc = "0.2"

# JSONL usage tracking (F-03/F-04 Budget Guard)
# Uses Claude Code's local JSONL logs for real token/cost data

# File watching (F-05)
notify = "7"

# HTTP server for external dashboard access
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# SQLite for agent session persistence (F-06)
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID for worktree naming + stable surface-id derivation (v5)
uuid = { version = "1", features = ["v4", "v5"] }
# CSPRNG-backed random for peer-federation auth nonces / session ids.
getrandom = "0.2"

# Peer federation protocol bindings
peer-proto = { path = "../peer-proto" }
tm-agent-bridge = { path = "../tm-agent-bridge" }
sync-protocol = { path = "../sync-protocol" }
prost = "0.13"

# Platform directories
dirs = "6"

# SHA-256 hashing for headless agent instructions integrity (Phase 2)
sha2 = "0.10"
hex = "0.4"
blake3 = "1"
chacha20poly1305 = "0.10.1"
zeroize = { version = "1.8.1", features = ["derive"] }
ed25519-dalek = "=3.0.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
hkdf = "=0.12.4"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1"
# Per-surface terminal emulator for peer grid snapshots. Already in the
# workspace via term-mesh-cli (same version), so this adds no new
# transitive dependency or compilation unit to the workspace build.
vt100 = "0.16"
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

# Force static zlib linking so term-meshd doesn't depend on Homebrew's libz.
# Without this, libgit2-sys links dynamically to /opt/homebrew/opt/zlib/lib/libz.1.dylib
# which crashes on machines without Homebrew (e.g. DMG installs).
libz-sys = { version = "1", features = ["static"] }

[dev-dependencies]
tempfile = "3"
# Paused-clock control for watch scheduler tests (tokio::time::advance / start_paused).
# Dev-only so the production build keeps the plain "full" feature set.
tokio = { version = "1", features = ["full", "test-util"] }
