[package]
name = "tm-coordinator"
version = "0.167.0"
edition = "2021"
rust-version = "1.88"
description = "term-mesh distributed workspace control-plane coordinator"

[[bin]]
name = "tm-coordinator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
