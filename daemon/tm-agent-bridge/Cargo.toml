[package]
name = "tm-agent-bridge"
version = "0.1.0"
edition = "2021"
description = "Speak an agent CLI's protocol on its behalf, and normalise what comes back"

[[bin]]
name = "tm-agent-bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# O_NOFOLLOW and kill(2): agy's log is read under the same checks the
# Python bridge makes, and a per-turn child is stopped by pid on timeout.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

