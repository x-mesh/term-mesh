[package]
name = "tm-agent-bridge"
version = "0.1.0"
edition = "2021"
description = "Speak an agent CLI's protocol on its behalf, and normalise what comes back"

[[bin]]
name = "tm-agent-bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
